name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/MQMeshUpdater --configuration Release --runtime win-x64 --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: MQMeshUpdater-win-x64
          path: publish/MQMeshUpdater.exe
          if-no-files-found: error
